name: Update job tracker

on:
  schedule:
    - cron: "17 11 * * *"     # 每天 UTC 11:17（美东 7:17）运行；可改
  workflow_dispatch:          # 也可以在 Actions 页面手动点运行
  push:
    paths: ["config.yaml", "data/status.json"]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python run.py
      - name: Commit results
        run: |
          git config user.name "job-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/jobs.json docs/index.html
          git diff --cached --quiet || git commit -m "update $(date -u +%F)"
          git push
